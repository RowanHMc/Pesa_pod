openapi: 3.0.3
info:
  title: Pesa Pod API
  version: 1.0.0
  description: "\n    Pesa Pod is a digital chama and ROSCA management platform.\n\n
    \   The API supports user authentication, chama management,\n    membership, savings
    cycles, contributions, transactions,\n    payouts, invitations, and notifications.\n\n
    \   Contributions are made externally. Pesa Pod records\n    reported payments
    and their confirmation by treasurers.\n    "
paths:
  /api/accounts/auth/login/:
    post:
      operationId: accounts_auth_login_create
      description: Base for endpoints anyone can call.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/auth/logout/:
    post:
      operationId: accounts_auth_logout_create
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
