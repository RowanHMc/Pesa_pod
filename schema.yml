components:
  schemas:
    CategoryEnum:
      enum:
      - task
      - reminder
      - update
      type: string
      description: |-
        * `task` - Task
        * `reminder` - Reminder
        * `update` - Update
    Chama:
      type: object
      properties:
        chama_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
        created_by_id:
          type: integer
          readOnly: true
        created_by_username:
          type: string
          readOnly: true
        my_role:
          type: string
          readOnly: true
        member_count:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chama_id
      - created_at
      - created_by_id
      - created_by_username
      - is_active
      - member_count
      - my_role
      - name
      - updated_at
    ChamaInvitation:
      type: object
      properties:
        invitation_id:
          type: string
          format: uuid
          readOnly: true
        chama_id:
          type: string
          format: uuid
          readOnly: true
        chama_name:
          type: string
          readOnly: true
        invited_user_id:
          type: integer
          readOnly: true
        invited_user_username:
          type: string
          readOnly: true
        invited_by_id:
          type: integer
          readOnly: true
        invited_by_username:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ChamaInvitationStatusEnum'
          readOnly: true
        reviewed_by_id:
          type: integer
          readOnly: true
          nullable: true
        reviewed_by_username:
          type: string
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        responded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - chama_id
      - chama_name
      - created_at
      - expires_at
      - invitation_id
      - invited_by_id
      - invited_by_username
      - invited_user_id
      - invited_user_username
      - responded_at
      - reviewed_at
      - reviewed_by_id
      - reviewed_by_username
      - status
    ChamaInvitationStatusEnum:
      enum:
      - pending_approval
      - awaiting_acceptance
      - accepted
      - rejected
      - declined
      - cancelled
      - expired
      type: string
      description: |-
        * `pending_approval` - Pending Approval
        * `awaiting_acceptance` - Awaiting Acceptance
        * `accepted` - Accepted
        * `rejected` - Rejected
        * `declined` - Declined
        * `cancelled` - Cancelled
        * `expired` - Expired
    ChamaRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
      required:
      - name
    Contribution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        chama_name:
          type: string
          readOnly: true
        round:
          type: string
          format: uuid
          readOnly: true
        round_number:
          type: integer
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
        membership:
          type: integer
          readOnly: true
        member_username:
          type: string
          readOnly: true
        amount_due:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        penalty_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        total_due:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ContributionStatusEnum'
          readOnly: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount_due
      - chama_name
      - created_at
      - due_date
      - id
      - member_username
      - membership
      - paid_at
      - penalty_amount
      - round
      - round_number
      - status
      - total_due
    ContributionStatusEnum:
      enum:
      - pending
      - paid
      type: string
      description: |-
        * `pending` - Pending
        * `paid` - Paid
    FrequencyEnum:
      enum:
      - weekly
      - monthly
      type: string
      description: |-
        * `weekly` - Weekly
        * `monthly` - Monthly
    KindEnum:
      enum:
      - payment_reported
      - payment_rejected
      - payout_to_record
      - payout_sent
      - payout_rejected
      - payout_stalled
      - contribution_due_soon
      - contribution_due_today
      - contribution_overdue
      - contribution_last_free_day
      - penalty_applied
      - overdue_summary
      - review_reminder
      - payout_record_reminder
      - payout_confirm_reminder
      - cycle_activated
      - round_opened
      - payment_confirmed
      - round_collected
      - payout_confirmed
      - cycle_completed
      - cycle_cancelled
      type: string
      description: |-
        * `payment_reported` - Payment awaiting review
        * `payment_rejected` - Payment rejected
        * `payout_to_record` - Payout to record
        * `payout_sent` - Payout to confirm
        * `payout_rejected` - Payout rejected
        * `payout_stalled` - Payout not confirmed
        * `contribution_due_soon` - Contribution due soon
        * `contribution_due_today` - Contribution due today
        * `contribution_overdue` - Contribution overdue
        * `contribution_last_free_day` - Last day before penalty
        * `penalty_applied` - Late penalty added
        * `overdue_summary` - Overdue contributions
        * `review_reminder` - Payments waiting for review
        * `payout_record_reminder` - Payout waiting to be recorded
        * `payout_confirm_reminder` - Payout waiting for you
        * `cycle_activated` - Cycle started
        * `round_opened` - Round opened
        * `payment_confirmed` - Payment confirmed
        * `round_collected` - Round collected
        * `payout_confirmed` - Payout confirmed
        * `cycle_completed` - Cycle completed
        * `cycle_cancelled` - Cycle cancelled
    MethodEnum:
      enum:
      - mpesa
      - bank
      - cash
      type: string
      description: |-
        * `mpesa` - M-Pesa
        * `bank` - Bank Transfer
        * `cash` - Cash
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        chama:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        chama_name:
          type: string
          readOnly: true
        data:
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - category
      - chama
      - chama_name
      - created_at
      - data
      - id
      - is_read
      - kind
      - read_at
      - title
    PaginatedChamaInvitationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
